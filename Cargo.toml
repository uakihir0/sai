[workspace]
resolver = "3"
members = [
    "crates/sai_diagnostics",
    "crates/sai_driver",
    "crates/sai_hir",
    "crates/sai_intern",
    "crates/sai_package",
    "crates/sai_query",
    "crates/sai_stable_hash",
    "crates/sai_syntax",
    "crates/sai_vfs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
blake3 = "1.8.7"
siphasher = "1.0.4"
libc = "0.2.190"
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
spdx = "0.13.6"
sha2 = "0.11.0"
unicode-general-category = "=1.1.0"
unicode-ident = "=1.0.18"
unicode-normalization = "=0.1.24"
