[workspace]
resolver = "3"
members = [
    "crates/sai_cli",
    "crates/sai_diagnostics",
    "crates/sai_driver",
    "crates/sai_fmt",
    "crates/sai_hir",
    "crates/sai_intern",
    "crates/sai_package",
    "crates/sai_query",
    "crates/sai_resolve",
    "crates/sai_stable_hash",
    "crates/sai_syntax",
    "crates/sai_windows_fs",
    "crates/sai_vfs",
    "vendor/gix-protocol-0.65.1",
    "vendor/gix-transport-0.59.2",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
blake3 = "1.8.7"
ctrlc = "=3.5.0"
glob = "0.3.3"
toml = "0.8.23"
siphasher = "1.0.4"
libc = "0.2.190"
gix = { version = "=0.87.1", default-features = false, features = ["sha1", "sha256", "blocking-http-transport-reqwest-rust-tls"] }
gix-pack = { version = "=0.74.2", default-features = false, features = ["generate", "sha1", "sha256", "streaming-input"] }
gix-transport = { version = "=0.59.2", default-features = false, features = ["blocking-client"] }
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process", "std"] }
spdx = "0.13.6"
sha2 = "0.11.0"
unicode-general-category = "=1.1.0"
unicode-ident = "=1.0.18"
unicode-normalization = "=0.1.24"
unicode-width = "0.2.1"
getrandom = "=0.4.3"

[patch.crates-io]
gix-protocol = { path = "vendor/gix-protocol-0.65.1" }
gix-transport = { path = "vendor/gix-transport-0.59.2" }
