name: CI

on:
  push:
    branches:
      - main
      - 'f/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test concurrent Windows package cache readers during updates
        if: runner.os == 'Windows'
        run: cargo test -p sai_package package_cache::tests::concurrent_readers_keep_tag_records_available_during_updates --locked -- --nocapture
      - name: Test Windows package cache recovery
        if: runner.os == 'Windows'
        run: cargo test -p sai_package package_cache::tests::corrupt_source_removal_clears_readonly_nested_files --locked -- --nocapture
      - name: Test workspace
        run: cargo test --workspace --locked
